name: dressly
description: "Some nice app to make some good outfits"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  file_picker: ^8.0.0
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.0   # explicit: we configure the image cache size
  crypto: ^3.0.3          # certificate pinning (see services/pinned_http.dart)
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# App launcher icon. Regenerate after changing the images with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0D0F0F"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true
  # The logo is drawn (widgets/brand_logo.dart), not shipped as a bitmap.
  # assets/icon*.png stay: they are read at build time by
  # flutter_launcher_icons, not at runtime.
  fonts:
    # Manrope, SIL Open Font License 1.1 (assets/fonts/OFL.txt).
    # Used by the logo only.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800