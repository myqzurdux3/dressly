name: Idea
description: Something the app should be able to do
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The wardrobe situation, not the implementation.
      placeholder: Pack for three days away without repeating a top.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: What the app makes you do instead, or why nothing fits.
